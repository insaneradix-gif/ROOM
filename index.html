<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>THE UNKNOWN</title>

<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#ddd;
    font-family:
        Arial,
        Tahoma,
        sans-serif;
}


/* =====================================================
   THREE.JS CANVAS
===================================================== */

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}


/* =====================================================
   GLOBAL UI
===================================================== */

#ui{
    position:fixed;
    inset:0;
    z-index:10;
    pointer-events:none;
}


/* =====================================================
   INTRO
===================================================== */

#intro{

    position:absolute;
    inset:0;

    display:flex;

    align-items:center;
    justify-content:center;

    text-align:center;

    padding:25px;

    pointer-events:auto;

    background:
        radial-gradient(
            circle at center,
            rgba(20,20,24,.25),
            rgba(0,0,0,.88) 75%
        );

    transition:
        opacity 2s,
        visibility 2s;

}


#intro.hidden{

    opacity:0;
    visibility:hidden;

}


.introContent{

    width:
        min(700px,95%);

}


.warning{

    color:#555;

    font-size:10px;

    letter-spacing:5px;

    margin-bottom:35px;

    animation:
        warningBlink 4s infinite;

}


@keyframes warningBlink{

    0%,
    40%,
    60%,
    100%{
        opacity:1;
    }

    50%{
        opacity:.15;
    }

}


.introTitle{

    font-size:
        clamp(38px,10vw,80px);

    font-weight:300;

    letter-spacing:8px;

    color:#ddd;

    margin-bottom:30px;

    text-shadow:
        0 0 40px
        rgba(255,255,255,.08);

}


.introQuestion{

    color:#999;

    font-size:
        clamp(18px,5vw,30px);

    line-height:2;

    margin-bottom:45px;

}


.startButton{

    pointer-events:auto;

    padding:
        16px 38px;

    color:#aaa;

    background:
        rgba(255,255,255,.015);

    border:
        1px solid #444;

    cursor:pointer;

    font-size:15px;

    transition:
        .5s;

}


.startButton:hover{

    color:#fff;

    border-color:#aaa;

    box-shadow:
        0 0 40px
        rgba(255,255,255,.08);

    transform:
        scale(1.05);

}


/* =====================================================
   GAME HUD
===================================================== */

#gameHUD{

    display:none;

    position:absolute;

    inset:0;

}


#gameHUD.active{

    display:block;

}


.gameTitle{

    position:absolute;

    top:25px;

    left:50%;

    transform:
        translateX(-50%);

    text-align:center;

}


.gameTitle .symbol{

    color:#777;

    font-size:22px;

    animation:
        symbolPulse 3s infinite;

}


@keyframes symbolPulse{

    0%,
    100%{
        opacity:.25;
    }

    50%{
        opacity:1;
    }

}


.gameTitle h2{

    margin-top:7px;

    font-weight:300;

    font-size:
        clamp(17px,4vw,25px);

    color:#999;

}


.gameTitle small{

    display:block;

    margin-top:7px;

    color:#444;

    font-size:10px;

}


/* =====================================================
   OBJECT MESSAGE
===================================================== */

#message{

    position:absolute;

    top:50%;
    left:50%;

    transform:
        translate(-50%,-50%);

    width:
        min(420px,88%);

    padding:28px;

    text-align:center;

    background:
        rgba(2,3,5,.76);

    border:
        1px solid
        rgba(150,150,150,.2);

    box-shadow:
        0 0 70px
        rgba(0,0,0,.95);

    backdrop-filter:
        blur(12px);

    opacity:0;

    visibility:hidden;

    transition:
        1s;

    pointer-events:auto;

}


#message.show{

    opacity:1;

    visibility:visible;

}


.messageLabel{

    color:#555;

    letter-spacing:5px;

    font-size:10px;

    margin-bottom:20px;

}


#message h3{

    color:#bbb;

    font-weight:300;

    font-size:25px;

    line-height:1.8;

}


#message p{

    color:#666;

    line-height:2;

    font-size:13px;

    margin:
        15px 0 25px;

}


.facebook{

    display:inline-block;

    text-decoration:none;

    color:#aaa;

    border:
        1px solid #444;

    padding:
        13px 25px;

    transition:.4s;

}


.facebook:hover{

    color:#fff;

    border-color:#aaa;

    box-shadow:
        0 0 30px
        rgba(255,255,255,.1);

}


/* =====================================================
   ROBOT DIALOG
===================================================== */

#robotUI{

    position:absolute;

    bottom:25px;

    left:50%;

    transform:
        translateX(-50%);

    width:
        min(360px,90%);

    text-align:center;

}


#robotName{

    color:#888;

    font-size:10px;

    letter-spacing:4px;

    margin-bottom:6px;

}


#robotSpeech{

    color:#666;

    font-size:12px;

    line-height:1.8;

    min-height:25px;

}


/* =====================================================
   HELP
===================================================== */

#help{

    position:absolute;

    bottom:15px;

    right:18px;

    color:#333;

    font-size:9px;

}


/* =====================================================
   CROSSHAIR
===================================================== */

#crosshair{

    position:absolute;

    left:50%;

    top:50%;

    width:12px;

    height:12px;

    transform:
        translate(-50%,-50%);

    opacity:.25;

}


#crosshair::before,
#crosshair::after{

    content:"";

    position:absolute;

    background:#aaa;

}


#crosshair::before{

    width:12px;

    height:1px;

    top:5px;

    left:0;

}


#crosshair::after{

    width:1px;

    height:12px;

    left:5px;

    top:0;

}


/* =====================================================
   SECRET FLASH
===================================================== */

#flash{

    position:fixed;

    inset:0;

    background:#fff;

    opacity:0;

    pointer-events:none;

    z-index:100;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    #help{
        display:none;
    }

    #message{
        padding:22px;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     USER INTERFACE
===================================================== -->

<div id="ui">


    <!-- INTRO -->

    <section id="intro">

        <div class="introContent">

            <div class="warning">

                لا تدخل إذا كنت تخاف مما ستجد

            </div>


            <h1 class="introTitle">

                UNKNOWN

            </h1>


            <div class="introQuestion">

                إذا اختفى كل شيء من حولك...
                <br>

                هل ستظل تعرف من أنت؟

            </div>


            <button
                class="startButton"
                onclick="startGame()"
            >

                أدخل العالم

            </button>

        </div>

    </section>



    <!-- GAME -->

    <div id="gameHUD">


        <div class="gameTitle">

            <div class="symbol">
                ◉
            </div>

            <h2>
                المكان الذي لم يكن يجب أن تجده
            </h2>

            <small>
                المرحلة الأولى
            </small>

        </div>


        <!-- MESSAGE -->

        <div id="message">

            <div class="messageLabel">

                رسالة مجهولة

            </div>


            <h3>

                لقد وصلت...

            </h3>


            <p>

                إذا كنت تريد معرفة ما يوجد
                خلف البوابة،

                <br>

                عليك أولًا أن تثبت أنك تستحق الدخول.

            </p>


            <a
                class="facebook"
                href="https://www.facebook.com/LONLY8"
                target="_blank"
            >

                أرسل هنا رسالة

            </a>

        </div>



        <!-- ROBOT -->

        <div id="robotUI">

            <div id="robotName">

                UNIT-07

            </div>


            <div id="robotSpeech">

                ...

            </div>

        </div>


        <div id="crosshair"></div>


        <div id="help">

            حرّك إصبعك لاستكشاف العالم

        </div>


    </div>

</div>


<div id="flash"></div>



<!-- =====================================================
     THREE.JS
===================================================== -->

<script src=
"https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js">
</script>



<script>

/* =====================================================
   VARIABLES
===================================================== */

let scene;

let camera;

let renderer;

let robot;

let robotHead;

let robotEyes = [];

let gate;

let gateLeft;

let gateRight;

let particles;

let clock =
    new THREE.Clock();

let mouseX = 0;

let mouseY = 0;

let gameStarted = false;


/* =====================================================
   CREATE WORLD
===================================================== */

function createWorld(){

    scene =
        new THREE.Scene();


    scene.background =
        new THREE.Color(
            0x010203
        );


    scene.fog =
        new THREE.FogExp2(
            0x010203,
            .035
        );


    /* CAMERA */

    camera =
        new THREE.PerspectiveCamera(
            55,

            window.innerWidth /
            window.innerHeight,

            .1,

            100
        );


    camera.position.set(
        0,
        1.7,
        9
    );


    /* RENDERER */

    renderer =
        new THREE.WebGLRenderer({
            antialias:true,
            alpha:true
        });


    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );


    document.body.prepend(
        renderer.domElement
    );


    /* LIGHT */

    const ambient =
        new THREE.AmbientLight(
            0x555555,
            .5
        );


    scene.add(
        ambient
    );


    const moonLight =
        new THREE.DirectionalLight(
            0x999999,
            1
        );


    moonLight.position.set(
        2,
        7,
        5
    );


    scene.add(
        moonLight
    );


    /* WORLD */

    createGround();

    createParticles();

    createGate();

    createRobot();

    createPillars();


    /* EVENTS */

    window.addEventListener(
        "resize",
        resize
    );


    document.addEventListener(
        "mousemove",
        mouseMove
    );


    document.addEventListener(
        "touchmove",
        touchMove,
        {
            passive:true
        }
    );


    animate();

}


/* =====================================================
   GROUND
===================================================== */

function createGround(){

    const geometry =
        new THREE.CircleGeometry(
            22,
            96
        );


    const material =
        new THREE.MeshStandardMaterial({
            color:0x07090b,
            roughness:1,
            metalness:.2
        });


    const ground =
        new THREE.Mesh(
            geometry,
            material
        );


    ground.rotation.x =
        -Math.PI/2;


    ground.position.y =
        -1;


    scene.add(
        ground
    );


    /* RINGS */

    for(
        let i=0;
        i<10;
        i++
    ){

        const ring =
            new THREE.Mesh(

                new THREE.RingGeometry(
                    1+i*.8,
                    1.015+i*.8,
                    96
                ),

                new THREE.MeshBasicMaterial({
                    color:0x1b1e22,
                    transparent:true,
                    opacity:.25
                })

            );


        ring.rotation.x =
            -Math.PI/2;


        ring.position.y =
            -.985;


        scene.add(
            ring
        );

    }

}


/* =====================================================
   PARTICLES
===================================================== */

function createParticles(){

    const geometry =
        new THREE.BufferGeometry();


    const positions=[];


    for(
        let i=0;
        i<1200;
        i++
    ){

        positions.push(

            (Math.random()-.5)*40,

            Math.random()*18-2,

            (Math.random()-.5)*40

        );

    }


    geometry.setAttribute(

        "position",

        new THREE.Float32BufferAttribute(
            positions,
            3
        )

    );


    const material =
        new THREE.PointsMaterial({

            color:0x777777,

            size:.035,

            transparent:true,

            opacity:.55

        });


    particles =
        new THREE.Points(
            geometry,
            material
        );


    scene.add(
        particles
    );

}


/* =====================================================
   PILLARS
===================================================== */

function createPillars(){

    for(
        let i=0;
        i<18;
        i++
    ){

        const height =
            2 +
            Math.random()*5;


        const geometry =
            new THREE.BoxGeometry(
                .7,
                height,
                .7
            );


        const material =
            new THREE.MeshStandardMaterial({

                color:0x0b0d10,

                roughness:.8,

                metalness:.5

            });


        const pillar =
            new THREE.Mesh(
                geometry,
                material
            );


        const angle =
            Math.random()*
            Math.PI*2;


        const radius =
            7+
            Math.random()*10;


        pillar.position.set(

            Math.cos(angle)*radius,

            height/2-1,

            Math.sin(angle)*radius

        );


        pillar.rotation.y =
            Math.random()*Math.PI;


        scene.add(
            pillar
        );

    }

}


/* =====================================================
   GATE
===================================================== */

function createGate(){

    gate =
        new THREE.Group();


    gate.position.set(
        0,
        2,
        -3
    );


    /* FRAME */

    const frameMaterial =
        new THREE.MeshStandardMaterial({

            color:0x111419,

            metalness:.8,

            roughness:.35

        });


    const sideGeometry =
        new THREE.BoxGeometry(
            .7,
            5,
            .8
        );


    const topGeometry =
        new THREE.BoxGeometry(
            5,
            .7,
            .8
        );


    const left =
        new THREE.Mesh(
            sideGeometry,
            frameMaterial
        );


    const right =
        new THREE.Mesh(
            sideGeometry,
            frameMaterial
        );


    const top =
        new THREE.Mesh(
            topGeometry,
            frameMaterial
        );


    left.position.x=-2.15;

    right.position.x=2.15;

    top.position.y=2.15;


    gate.add(
        left,
        right,
        top
    );


    /* DOORS */

    const doorGeometry =
        new THREE.BoxGeometry(
            1.9,
            4.3,
            .35
        );


    const doorMaterial =
        new THREE.MeshStandardMaterial({

            color:0x080a0d,

            metalness:.7,

            roughness:.4

        });


    gateLeft =
        new THREE.Mesh(
            doorGeometry,
            doorMaterial
        );


    gateRight =
        new THREE.Mesh(
            doorGeometry,
            doorMaterial
        );


    gateLeft.position.set(
        -1,
        0,
        0
    );


    gateRight.position.set(
        1,
        0,
        0
    );


    gate.add(
        gateLeft,
        gateRight
    );


    /* SYMBOL */

    const symbolGeometry =
        new THREE.TorusGeometry(
            .65,
            .035,
            12,
            64
        );


    const symbolMaterial =
        new THREE.MeshBasicMaterial({
            color:0x777777
        });


    const symbol =
        new THREE.Mesh(
            symbolGeometry,
            symbolMaterial
        );


    symbol.position.z =
        -.25;


    gate.add(
        symbol
    );


    scene.add(
        gate
    );

}


/* =====================================================
   ROBOT
===================================================== */

function createRobot(){

    robot =
        new THREE.Group();


    robot.position.set(
        0,
        -.1,
        3
    );


    /* BODY */

    const body =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                .8,
                1,
                .65
            ),

            new THREE.MeshStandardMaterial({

                color:0x181c20,

                metalness:.8,

                roughness:.3

            })

        );


    robot.add(
        body
    );


    /* HEAD */

    robotHead =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                .9,
                .65,
                .7
            ),

            new THREE.MeshStandardMaterial({

                color:0x24282d,

                metalness:.8,

                roughness:.25

            })

        );


    robotHead.position.y =
        .8;


    robot.add(
        robotHead
    );


    /* EYES */

    const eyeGeometry =
        new THREE.SphereGeometry(
            .09,
            16,
            16
        );


    const eyeMaterial =
        new THREE.MeshBasicMaterial({
            color:0xcccccc
        });


    const eyeL =
        new THREE.Mesh(
            eyeGeometry,
            eyeMaterial.clone()
        );


    const eyeR =
        new THREE.Mesh(
            eyeGeometry,
            eyeMaterial.clone()
        );


    eyeL.position.set(
        -.2,
        .82,
        -.36
    );


    eyeR.position.set(
        .2,
        .82,
        -.36
    );


    robot.add(
        eyeL,
        eyeR
    );


    robotEyes=[
        eyeL,
        eyeR
    ];


    /* ANTENNA */

    const antenna =
        new THREE.Mesh(

            new THREE.CylinderGeometry(
                .025,
                .025,
                .45,
                10
            ),

            new THREE.MeshStandardMaterial({
                color:0x44484d,
                metalness:.8
            })

        );


    antenna.position.y =
        1.35;


    robot.add(
        antenna
    );


    /* ANTENNA LIGHT */

    const light =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                .07,
                12,
                12
            ),

            new THREE.MeshBasicMaterial({
                color:0xaaaaaa
            })

        );


    light.position.y =
        1.58;


    robot.add(
        light
    );


    /* LEGS */

    const legMaterial =
        new THREE.MeshStandardMaterial({

            color:0x101215,

            metalness:.8,

            roughness:.35

        });


    const legGeometry =
        new THREE.BoxGeometry(
            .22,
            .65,
            .3
        );


    const legL =
        new THREE.Mesh(
            legGeometry,
            legMaterial
        );


    const legR =
        new THREE.Mesh(
            legGeometry,
            legMaterial
        );


    legL.position.set(
        -.22,
        -.8,
        0
    );


    legR.position.set(
        .22,
        -.8,
        0
    );


    robot.add(
        legL,
        legR
    );


    /* ARMS */

    const armGeometry =
        new THREE.BoxGeometry(
            .18,
            .7,
            .22
        );


    const armL =
        new THREE.Mesh(
            armGeometry,
            legMaterial
        );


    const armR =
        new THREE.Mesh(
            armGeometry,
            legMaterial
        );


    armL.position.set(
        -.55,
        -.05,
        0
    );


    armR.position.set(
        .55,
        -.05,
        0
    );


    robot.add(
        armL,
        armR
    );


    /* RING */

    const ring =
        new THREE.Mesh(

            new THREE.TorusGeometry(
                1,
                .012,
                8,
                64
            ),

            new THREE.MeshBasicMaterial({

                color:0x555555,

                transparent:true,

                opacity:.35

            })

        );


    ring.rotation.x =
        Math.PI/2;


    ring.position.y =
        -1;


    robot.add(
        ring
    );


    scene.add(
        robot
    );

}


/* =====================================================
   START GAME
===================================================== */

function startGame(){

    gameStarted=true;


    document
        .getElementById("intro")
        .classList.add("hidden");


    setTimeout(
        function(){

            document
                .getElementById("gameHUD")
                .classList.add("active");


            document
                .getElementById("message")
                .classList.add("show");


            document
                .getElementById("robotSpeech")
                .innerHTML=

                "مرحبًا...<br>"+
                "أنا UNIT-07.";


        },

        1800
    );

}


/* =====================================================
   MOUSE
===================================================== */

function mouseMove(event){

    mouseX=
        event.clientX/
        window.innerWidth-
        .5;


    mouseY=
        event.clientY/
        window.innerHeight-
        .5;

}


/* =====================================================
   TOUCH
===================================================== */

function touchMove(event){

    if(
        !event.touches ||
        !event.touches.length
    )
        return;


    mouseX=
        event.touches[0].clientX/
        window.innerWidth-
        .5;


    mouseY=
        event.touches[0].clientY/
        window.innerHeight-
        .5;

}


/* =====================================================
   RESIZE
===================================================== */

function resize(){

    camera.aspect=
        window.innerWidth/
        window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

}


/* =====================================================
   ANIMATION
===================================================== */

function animate(){

    requestAnimationFrame(
        animate
    );


    const time=
        clock.getElapsedTime();


    /* ROBOT */

    if(robot){

        robot.position.y=
            -.1+
            Math.sin(time*2)*.025;


        robot.rotation.y=
            Math.sin(time*.6)*.15;

    }


    /* PARTICLES */

    if(particles){

        particles.rotation.y=
            time*.008;

    }


    /* CAMERA */

    camera.position.x +=
        (
            mouseX*.9-
            camera.position.x
        )*.025;


    camera.position.y +=
        (
            1.7-
            mouseY*.45-
            camera.position.y
        )*.025;


    camera.lookAt(
        0,
        .5,
        -1
    );


    renderer.render(
        scene,
        camera
    );

}


/* =====================================================
   START
===================================================== */

createWorld();

</script>

</body>
</html>
