<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SYSTEM BREACH</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        background-color: #000;
        color: #ff003c;
        font-family: 'Courier New', Courier, monospace;
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        user-select: none;
    }

    /* خلفية الماتريكس الحمراء */
    canvas {
        position: absolute;
        top: 0;
        left: 0;
        z-index: 1;
        opacity: 0.15;
    }

    /* الحاوية الرئيسية */
    .container {
        position: relative;
        z-index: 2;
        text-align: center;
        width: 90%;
        max-width: 600px;
        background: rgba(10, 0, 0, 0.85);
        border: 1px solid #ff003c;
        padding: 30px;
        box-shadow: 0 0 30px rgba(255, 0, 60, 0.4);
        border-radius: 8px;
    }

    /* تأثير الوميض */
    .warning-title {
        font-size: 24px;
        font-weight: bold;
        letter-spacing: 2px;
        animation: blink 0.8s infinite alternate;
        margin-bottom: 10px;
    }

    .alert-banner {
        color: #ff003c;
        background: rgba(255, 0, 60, 0.1);
        border: 1px solid #ff003c;
        padding: 8px;
        font-size: 14px;
        font-weight: bold;
        margin-bottom: 15px;
        letter-spacing: 1px;
    }

    @keyframes blink {
        0% { opacity: 1; text-shadow: 0 0 15px #ff003c; }
        100% { opacity: 0.2; text-shadow: none; }
    }

    /* عرض الرقم */
    .target-number {
        font-size: 26px;
        color: #fff;
        background: #110003;
        border: 1px dashed #ff003c;
        padding: 10px;
        margin: 10px 0 15px 0;
        letter-spacing: 3px;
        text-shadow: 0 0 8px #ff003c;
    }

    /* نافذة الاختراقات الوهمية */
    .terminal-box {
        height: 150px;
        background: #050001;
        border: 1px solid #330008;
        padding: 10px;
        text-align: left;
        font-size: 12px;
        color: #00ff66;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        margin-bottom: 20px;
        direction: ltr;
    }

    .alert-red {
        color: #ff003c !important;
        font-weight: bold;
    }

    /* شريط السحب */
    .progress-section {
        margin-top: 15px;
    }

    .status-text {
        font-size: 14px;
        color: #e0e0e0;
        margin-bottom: 8px;
    }

    .progress-bar-bg {
        width: 100%;
        height: 18px;
        background: #1a0005;
        border: 1px solid #ff003c;
        border-radius: 9px;
        overflow: hidden;
        position: relative;
    }

    .progress-bar-fill {
        width: 0%;
        height: 100%;
        background: #ff003c;
        box-shadow: 0 0 10px #ff003c;
        transition: width 0.1s linear;
    }

    .percentage {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 11px;
        color: #fff;
        font-weight: bold;
    }
</style>
</head>
<body>

<canvas id="matrix"></canvas>

<div class="container">
    <div class="warning-title">⚠️ SYSTEM COMPROMISED ⚠️</div>
    <div class="alert-banner">تم اختراق جهازك بالكامل!</div>
    
    <div>TARGET DEVICE DETECTED</div>
    <div class="target-number">+212 X-XXX-XXXX</div>

    <!-- سجل الاختراقات الوهمي -->
    <div class="terminal-box" id="terminal"></div>

    <!-- شريط التقدم -->
    <div class="progress-section">
        <div class="status-text">جاري سحب كافة المعلومات والبيانات...</div>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progress"></div>
            <div class="percentage" id="percentText">0%</div>
        </div>
    </div>
</div>

<script>
    // 1. خلفية الماتريكس
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const chars = '01101001010101010101';
    const fontSize = 14;
    const columns = canvas.width / fontSize;
    const drops = Array(Math.floor(columns)).fill(1);

    function drawMatrix() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ff003c';
        ctx.font = fontSize + 'px monospace';

        for (let i = 0; i < drops.length; i++) {
            const text = chars.charAt(Math.floor(Math.random() * chars.length));
            ctx.fillText(text, i * fontSize, drops[i] * fontSize);
            if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                drops[i] = 0;
            }
            drops[i]++;
        }
    }
    setInterval(drawMatrix, 33);

    // 2. سجل الأوامر الوهمي المعدل
    const logs = [
        { text: "> Bypassing system firewall...", isAlert: false },
        { text: "> FULL DEVICE ACCESS GRANTED [تم اختراق الجهاز بالكامل]", isAlert: true },
        { text: "> GPS TRACKING ACTIVE: LOCATION PINPOINTED [تم تحديد الموقع]", isAlert: true },
        { text: "> Extracting Whatsapp database...", isAlert: false },
        { text: "> Accessing media & photos gallery...", isAlert: false },
        { text: "> Fetching passwords & banking data...", isAlert: false },
        { text: "> Uploading target payload to shadow server...", isAlert: false }
    ];

    const terminal = document.getElementById('terminal');
    let logIndex = 0;

    function addLog() {
        if (logIndex < logs.length) {
            const p = document.createElement('div');
            p.textContent = logs[logIndex].text;
            if (logs[logIndex].isAlert) {
                p.classList.add('alert-red');
            }
            terminal.appendChild(p);
            logIndex++;
            setTimeout(addLog, Math.random() * 800 + 400);
        }
    }
    addLog();

    // 3. شريط تقدم سحب البيانات
    let percent = 0;
    const progressFill = document.getElementById('progress');
    const percentText = document.getElementById('percentText');

    const progressInterval = setInterval(() => {
        if (percent < 100) {
            percent += 1;
            progressFill.style.width = percent + '%';
            percentText.textContent = percent + '%';
        } else {
            clearInterval(progressInterval);
            percentText.textContent = "DEVICE LOCKED!";
        }
    }, 120);
</script>

</body>
</html>
