<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>THE LAST QUESTION: VOID & PUNISHMENT</title>

<style>
:root {
    --bg-black: #000000;
    --blood-red: #ff003c;
    --red-glow: rgba(255, 0, 60, 0.5);
    --silver-text: #e0e0e0;
    --dark-border: #220008;
}

*{ box-sizing:border-box; margin:0; padding:0; user-select:none; }
html, body{ width:100%; height:100%; overflow:hidden; background-color: var(--bg-black); color: var(--silver-text); font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }

canvas{ position:fixed; inset:0; z-index:0; touch-action: none; }

#vignette{ 
    position:fixed; inset:0; z-index:5; pointer-events:none; 
    background: radial-gradient(circle at center, transparent 20%, rgba(5,0,2,0.8) 70%, rgba(0,0,0,0.98) 100%);
    box-shadow: inset 0 0 120px rgba(255, 0, 60, 0.2);
}

#glitchOverlay {
    position: fixed; inset: 0; z-index: 6; pointer-events: none; opacity: 0;
    background: rgba(255,0,60,0.12); mix-blend-mode: color-dodge; transition: opacity 0.1s;
}

/* واجهة الأسئلة */
#intro{ 
    position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center; 
    background: radial-gradient(circle at center, rgba(15,0,5,0.95) 0%, rgba(0,0,0,0.99) 80%);
    transition: opacity 0.8s, transform 0.8s; 
}
#intro.hide{ opacity:0; transform:scale(1.05); pointer-events:none; }

.introBox{ width:min(800px,92%); text-align:center; position:relative; }
.warning{ 
    color: var(--blood-red); font-size:11px; letter-spacing:6px; margin-bottom:20px; 
    text-shadow: 0 0 10px var(--red-glow); animation: pulseRed 2s infinite; 
}

@keyframes pulseRed {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; text-shadow: 0 0 25px var(--blood-red); }
}

.title{ 
    font-size: clamp(32px,8vw,70px); font-weight:900; letter-spacing:10px; color: #ffffff; 
    text-shadow: 0 0 30px var(--red-glow); margin-bottom:15px; text-transform: uppercase;
}

.subtitle{ color:#888888; font-size:12px; line-height:2; margin-bottom:30px; letter-spacing: 1px; }

#choiceScreen{ display:block; }
#choiceScreen.hide{ display:none; }
.choiceQuestion{ color:#ccc; font-size: clamp(16px,4vw,22px); line-height:1.8; margin-bottom:30px; }
.choices{ display:flex; gap:20px; justify-content:center; flex-wrap:wrap; }

.choice{ 
    width:min(320px,90vw); padding:22px; color:#aaa; 
    background: rgba(10, 0, 4, 0.8); border:1px solid var(--dark-border); cursor:pointer; transition: .3s;
    backdrop-filter: blur(10px); text-align: right; position: relative; overflow: hidden;
}
.choice::before {
    content:''; position: absolute; top:0; right:0; width:3px; height:100%; background: var(--blood-red); opacity:0; transition:.3s;
}
.choice:hover::before { opacity:1; }
.choice:hover{ 
    color:#fff; border-color: var(--blood-red); transform: translateY(-3px); 
    box-shadow: 0 10px 30px var(--red-glow); 
}
.choiceNumber{ display:block; color: var(--blood-red); font-size:10px; margin-bottom:8px; font-weight:bold; letter-spacing: 3px; }
.choiceText{ font-size:14px; line-height:1.7; }

#philosophy{ display:none; }
#philosophy.active{ display:block; }

.progressTrack { width: 100%; height: 4px; background: #110004; border: 1px solid var(--dark-border); margin-bottom: 25px; position: relative; }
.progressBar { width: 0%; height: 100%; background: var(--blood-red); box-shadow: 0 0 10px var(--blood-red); transition: width 0.3s ease; }

.questionCounter{ color: var(--blood-red); font-size:11px; letter-spacing:4px; margin-bottom:15px; font-weight: bold; }
.question{ color:#fff; font-size: clamp(16px,3.8vw,24px); line-height:1.9; margin-bottom:30px; text-shadow: 0 0 10px rgba(0,0,0,0.9); }
.answers{ display:grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap:12px; width:min(700px,95%); margin:auto; }
.answer{ 
    padding:18px; background: rgba(5,0,2,0.9); border:1px solid var(--dark-border); color:#aaa; 
    cursor:pointer; transition:.2s; font-size:13px; text-align: right; line-height: 1.6;
}
.answer:hover{ color:#fff; border-color: var(--blood-red); background: rgba(20,0,5,0.95); box-shadow: 0 0 20px var(--red-glow); }

/* غرفة العقاب المتغيرة */
#punishmentRoom{ 
    display:none; position:fixed; inset:0; z-index:200; align-items:center; justify-content:center; 
    text-align:center; background: #000000;
}
#punishmentRoom.active{ display:flex; }
.punishmentBox{ width:min(650px,92%); background: rgba(5, 0, 2, 0.98); border: 1px solid var(--blood-red); padding: 40px 20px; box-shadow: 0 0 80px var(--red-glow); }
.punishmentTitle{ color: var(--blood-red); font-size: clamp(22px,5vw,42px); letter-spacing:4px; font-weight:900; margin-bottom:15px; text-shadow: 0 0 15px var(--blood-red); }
.punishmentSub{ color: #888; font-size: 13px; line-height: 1.8; margin-bottom: 25px; }
.punishmentCounter{ font-size: 40px; color: #fff; font-weight: 900; text-shadow: 0 0 20px var(--blood-red); margin-bottom: 10px; font-family: monospace; }
.punishmentProgress{ width: 100%; height: 8px; background: #100003; border: 1px solid var(--dark-border); margin-bottom: 30px; }
#punishBar{ width: 0%; height: 100%; background: var(--blood-red); box-shadow: 0 0 15px var(--blood-red); transition: width 0.05s linear; }

.punishBtn {
    padding: 16px 40px; background: transparent; color: var(--blood-red); border: 1px solid var(--blood-red); font-weight: bold; font-size: 15px;
    letter-spacing: 3px; cursor: pointer; transition: 0.2s; box-shadow: 0 0 15px var(--red-glow); text-transform: uppercase;
}
.punishBtn:active{ transform: scale(0.95); background: var(--blood-red); color: #000; }

.punishInput {
    width: 80%; padding: 12px; background: #000; border: 1px solid var(--blood-red); color: #fff;
    text-align: center; font-size: 16px; margin-bottom: 20px; outline: none;
}

/* واجهة اللعبة والتحكم */
#game{ display:none; position:fixed; inset:0; z-index:10; }
#game.active{ display:block; }
#hud{ position:absolute; inset:0; pointer-events:none; }
.topHud{ position:absolute; top:20px; left:20px; right:20px; display:flex; justify-content:space-between; align-items:flex-start; }
.hudBlock{ color:#666; font-size:10px; line-height:1.6; letter-spacing:2px; font-weight: bold; }
.hudValue{ color: var(--blood-red); font-size:20px; font-weight:900; text-shadow: 0 0 10px var(--red-glow); font-family: monospace; }
.stage{ text-align:center; }
.stageName{ color:#fff; font-size:12px; letter-spacing:4px; font-weight:bold; }
.stageSub{ color: var(--blood-red); font-size:9px; margin-top:4px; letter-spacing:2px; }

#robotDialogue{ position:absolute; left:50%; bottom:160px; transform: translateX(-50%); width:min(600px,90%); text-align:center; z-index: 30; }
.robotName{ color: var(--blood-red); font-size:9px; letter-spacing:5px; margin-bottom:6px; font-weight:bold; }
.robotText{ color:#ccc; font-size:14px; line-height:1.7; text-shadow: 0 0 10px rgba(0,0,0,0.9); background: rgba(0,0,0,0.6); padding: 10px; border-radius: 4px; }

#interact{ 
    position:absolute; left:50%; bottom:110px; transform: translateX(-50%); pointer-events:auto; display:none; 
    padding: 12px 35px; background: rgba(0,0,0,0.9); color: var(--blood-red); border:1px solid var(--blood-red); 
    cursor:pointer; font-weight:bold; letter-spacing:2px; transition:.2s; box-shadow: 0 0 20px var(--red-glow); font-size: 13px;
}
#interact.show{ display:block; }
#interact:hover{ background: var(--blood-red); color:#000; }

/* أزرار الحركة للهواتف */
#touchControls {
    position: absolute; bottom: 20px; left: 20px; z-index: 50; pointer-events: auto;
    display: grid; grid-template-columns: repeat(3, 50px); grid-template-rows: repeat(2, 50px); gap: 5px;
}
.dpadBtn {
    width: 50px; height: 50px; background: rgba(10, 0, 4, 0.7); border: 1px solid var(--blood-red);
    color: var(--blood-red); font-weight: bold; font-size: 18px; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 10px var(--red-glow); touch-action: manipulation;
}
.dpadBtn:active { background: var(--blood-red); color: #000; }
#btnUp { grid-column: 2; grid-row: 1; }
#btnLeft { grid-column: 1; grid-row: 2; }
#btnDown { grid-column: 2; grid-row: 2; }
#btnRight { grid-column: 3; grid-row: 2; }

.modal{ position:fixed; inset:0; z-index:70; display:none; align-items:center; justify-content:center; background: rgba(0,0,0,0.95); padding:20px; }
.modal.active{ display:flex; }
.modalBox{ width:min(600px,95%); background: #030002; border:1px solid var(--blood-red); padding:35px; text-align:center; box-shadow: 0 0 60px var(--red-glow); }
.modalLabel{ color: var(--blood-red); font-size:10px; letter-spacing:4px; margin-bottom:15px; }
.modalTitle{ color:#fff; font-size:20px; line-height:1.6; margin-bottom:20px; }
.modalAnswers{ display:grid; gap:10px; }
.modalAnswer{ padding:14px; background:#000; color:#aaa; border:1px solid var(--dark-border); cursor:pointer; transition:.2s; font-size: 13px; }
.modalAnswer:hover{ color:#fff; border-color: var(--blood-red); background: rgba(20,0,5,0.8); }
.modalResult{ min-height:25px; color: var(--blood-red); margin-top:15px; font-size:12px; font-weight:bold; }

@media(max-width:600px){
    .answers{ grid-template-columns:1fr; }
    .topHud{ top:15px; left:15px; right:15px; }
    #robotDialogue{ bottom: 150px; }
}
</style>
</head>
<body>

<audio id="bgPiano" loop preload="auto" src="https://ia801503.us.archive.org/15/items/CreepyPianoMusic/Creepy%20Piano.mp3"></audio>

<div id="vignette"></div>
<div id="glitchOverlay"></div>

<div id="intro">
    <div class="introBox">
        <div class="warning"> SYSTEM PROTOCOL // ABYSSAL EVALUATION </div>
        <div class="title">THE LAST QUESTION</div>
        <div class="subtitle">أجب على الأسئلة الـ 25 بالتتابع.<br>عند الخطأ ستخضع لعقاب تطهير، ثم تواصل من حيث توقفت.</div>
        
        <div id="choiceScreen">
            <div class="choiceQuestion">اختر مسار عقلك قبل بدء التقييم:</div>
            <div class="choices">
                <button class="choice" onclick="choosePath('mind')">
                    <span class="choiceNumber">PATH // 01</span>
                    <span class="choiceText">مواجهة الظلام بالعقل العقلاني الحاد.</span>
                </button>
                <button class="choice" onclick="choosePath('fear')">
                    <span class="choiceNumber">PATH // 02</span>
                    <span class="choiceText">استكشاف المجهول وإدراك الفناء المطلق.</span>
                </button>
            </div>
        </div>

        <div id="philosophy">
            <div class="progressTrack"><div id="progressBar" class="progressBar"></div></div>
            <div id="questionCounter" class="questionCounter"></div>
            <div id="question" class="question"></div>
            <div id="answers" class="answers"></div>
        </div>
    </div>
</div>

<!-- غرفة العقاب الديناميكية -->
<div id="punishmentRoom">
    <div class="punishmentBox">
        <div class="punishmentTitle">PUNISHMENT ROOM</div>
        <div id="punishmentSub" class="punishmentSub">...</div>
        <div id="punishCounter" class="punishmentCounter">0</div>
        <div class="punishmentProgress"><div id="punishBar"></div></div>
        <div id="punishmentActionArea"></div>
    </div>
</div>

<div id="game">
    <div id="hud">
        <div class="topHud">
            <div class="hudBlock">PSYCH ENERGY<div id="points" class="hudValue">0</div></div>
            <div class="stage">
                <div id="stageName" class="stageName">SECTOR 01</div>
                <div id="stageSub" class="stageSub">ABYSSAL VOID</div>
            </div>
            <div class="hudBlock">PENALTIES<div id="mistakes" class="hudValue">0</div></div>
        </div>

        <div id="robotDialogue">
            <div id="robotName" class="robotName">SYSTEM // CTHULHU ENGINE</div>
            <div id="robotText" class="robotText">...</div>
        </div>

        <button id="interact" onclick="interact()">INTERACT</button>

        <div id="touchControls">
            <div class="dpadBtn" id="btnUp">▲</div>
            <div class="dpadBtn" id="btnLeft">◄</div>
            <div class="dpadBtn" id="btnDown">▼</div>
            <div class="dpadBtn" id="btnRight">►</div>
        </div>
    </div>
</div>

<div id="puzzleModal" class="modal">
    <div class="modalBox">
        <div class="modalLabel">GATE PROTOCOL</div>
        <div id="puzzleTitle" class="modalTitle"></div>
        <div id="puzzleDescription" class="modalDescription"></div>
        <div id="puzzleAnswers" class="modalAnswers"></div>
        <div id="puzzleResult" class="modalResult"></div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
const QUESTIONS = [
{ text: "1. إذا علم الكيان بموعد إعدامك الأبدي، هل تطلب منه كشف التاريخ أم تظل آمناً في جهلك؟", answers:[ "أريد التاريخ، المعرفة أقوى.", "الجهل أرحم من العذاب.", "الموت مجرد وهم برلماني.", "سأقتله قبل أن يخبرني." ], correct:1 },
{ text: "2. لو استُبدلت ذراتك بالكامل بمادة سوداء مظلمة وبقيت ذكرياتك... هل ما زلت أنت؟", answers:[ "نعم، الذكريات هي الروح.", "لا، أصبحت كائناً آخر.", "لا يوجد إنسان أصلاً.", "أنا الكيان الجديد." ], correct:2 },
{ text: "3. لتنقذ العالم من الفناء الكامل، هل أنت مستعد لتضحية بطفل بريء بيدك؟", answers:[ "نعم، المصلحة الكبرى تقتضي ذلك.", "لا، القتل المباشر جريمة.", "سأترك العالم يحترق.", "سأضحي بنفسي بدلاً عنه." ], correct:1 },
{ text: "4. إذا كانت كل أفكارك مجرد خوارزمية مبرمجة، فهل لمشاعرك أي قيمة حقيقية؟", answers:[ "لا، كل شيء عبثي ومحدد.", "نعم، الشعور حقيقي.", "الحرية وهم نغذيه.", "أنا من يكتب الخوارزمية." ], correct:2 },
{ text: "5. إذا كان الصمت هو الحقيقة الوحيدة المطلقة، فلماذا نصر على الكلام؟", answers:[ "لنغطي على صوت الفراغ المرعب.", "لأننا نمتلك ألسنة.", "الكلام يصنع الوجود.", "الصمت وهم أيضاً." ], correct:0 },
{ text: "6. لو أتيح لك مسح ألمك الأكبر من ذكرياتك مقابل فقدان قدرتك على الحب... هل تقبل؟", answers:[ "نعم، الألم أشد من فوائد الحب.", "لا، ألمي يصنع هويتي.", "الحب والألم كلاهما خداع.", "أمسح الحب وأبقي الألم." ], correct:1 },
{ text: "7. ما الفرق بين مجنون يرى حقيقة لا نراها، وعاقل يعيش في وهم جماعي؟", answers:[ "المجنون حر، والعاقل سجين.", "لا يوجد فرق سوى في الأغلبية.", "العاقل يبني والمجنون يهدم.", "كلاهما ميت." ], correct:1 },
{ text: "8. لو ملكت زراً ينهي كل آلام العالم بإنهاء الوجود تماماً وبلمشة عين، هل تضغطه؟", answers:[ "نعم، إنهاء المعاناة هو الرحمة.", "لا، الأمل يستحق التجربة.", "أتفحص الزر أولاً.", "أضغط مرتين للتأكيد." ], correct:0 },
{ text: "9. الخوف الأكبر للإنسان: أهو الخوف من الموت أم الخوف من ألا يكون قد عاش أبداً؟", answers:[ "الخوف من الموت.", "الخوف من العيش بلا معنى.", "الخوف من الكيان الأبدي.", "لا أساليب للخوف." ], correct:1 },
{ text: "10. هل العدالة مجرد انتقام تم إلباسه ثوب القانون الأنيق؟", answers:[ "نعم، إنها تنظيم للانتقام.", "لا، العدالة توازن كوني.", "القانون حماية للضعفاء.", "لا توجد عدالة." ], correct:0 },
{ text: "11. إذا كان الزمن يلتهم كل إنجازاتنا، فهل نحن أحياء أم مجرد أموات ننتظر دورنا؟", answers:[ "أموات يتنفسون في الانتظار.", "أحياء نصنع أثراً دائماً.", "الزمن لا وجود له.", "نحن نلتهم الزمن." ], correct:0 },
{ text: "12. السعادة في جهل مطلق أم العذاب في معرفة الحقيقة المظلمة الأبدية؟", answers:[ "الجهل الجميل.", "الحقيقة المرة دائماً.", "لا هذا ولا ذاك.", "المعرفة خيانة." ], correct:1 },
{ text: "13. هل الجحيم مكان ننتقل إليه، أم حالة نفسية نصنعها بأيدينا هنا؟", answers:[ "حالة نفسية نصنعها الآن.", "مكان حقيقي للتعذيب.", "الجحيم هم الآخرون.", "الجحيم لا ينتهي." ], correct:0 },
{ text: "14. لو استطعت رؤية آخِر لحظة في حياتك دون تغيرها، هل ترغب في رؤيتها؟", answers:[ "نعم، لأستعد لها.", "لا، ستدمر كل لحظة حاضرة.", "أراها وأضحك.", "الرؤية ستغير المصير." ], correct:1 },
{ text: "15. هل الإنسان شرير بطبعه والخير تصنع، أم العكس؟", answers:[ "الشر هو الأصل والخير غطاء.", "الخير هو الفطرة والشر مكتسب.", "الإنسان أبيض بلا طبع.", "الكائنات كلها محايدة." ], correct:0 },
{ text: "16. إذا كانت الحرية تعني القدرة على اختيار ألمك، فهل العبد السعيد حُر؟", answers:[ "لا، العبودية تنفي الحرية.", "نعم، طالما أنه يشعر بالسعادة.", "السعادة والحرية متناقضان.", "الكل عبيد." ], correct:0 },
{ text: "17. لو قتلت شخصاً شريراً لتنقذ 10 أشرار آخرين، فهل زاد عدد القتلة في العالم؟", answers:[ "يبقى كما هو إذا كنت قاتلاً سابقاً.", "يزيد برجل واحد.", "ينقص لأن الشرير مات.", "الأرقام لا تهم." ], correct:1 },
{ text: "18. هل الذاكرة خادمة أم سجّانة؟", answers:[ "سجّانة تقيدك بالماضي.", "خادمة تحفظ تجاربك.", "لا هذه ولا تلك.", "الذاكرة طيف." ], correct:0 },
{ text: "19. إذا كانت الحياة مسرحية، فمن يجلس في مقاعد الجمهور؟", answers:[ "الموت والعدم.", "الأرواح القديمة.", "لا أحد، القاعة فارغة.", "نحن نتفرج على أنفسنا." ], correct:2 },
{ text: "20. هل الأمل نغمة ملائكية أم طعم لئيم يطيل عذاب الضحية؟", answers:[ "طعم لئيم يمنعك من الاستسلام.", "نغمة تمنح القوة.", "الأمل خرافة.", "سلاح للضعفاء." ], correct:0 },
{ text: "21. ما هو أثقل عبء يحمله الإنسان في حياته؟", answers:[ "سر لم يخبر به أحداً.", "ندم على فرصة مضت.", "وعيه بذاته وفنائه.", "ذنوب الآخرين." ], correct:2 },
{ text: "22. إذا استطاع ذكاء اصطناعي محاكاة روحك بالكامل بعد موتك، فهل خُلدت أم استُبدلت؟", answers:[ "استُبدلت بنسخة مزيفة.", "خُلدت روحياً.", "كلاهما صحيح.", "لا وجود للروح." ], correct:0 },
{ text: "23. هل الظلام هو غياب النور، أم أنه الأصل الذي خرج منه كل النور؟", answers:[ "هو الأصل المطلق للوجود.", "مجرد غياب للنور.", "الظلام والنور شيء واحد.", "الظلام كائن حي." ], correct:0 },
{ text: "24. إذا كان بإمكانك الخلود كروح بلا جسد في الفراغ المطلق للأبد، هل تقبل؟", answers:[ "لا، الخلود الفارغ جحيم أكبر.", "نعم، للهروب من الجسد.", "أقبل لبعض الوقت فقط.", "الفراغ لا يتسع لي." ], correct:0 },
{ text: "25. من هو السجين الحقيقي في هذا العالم؟", answers:[ "من يبني سجناً من أفكاره داخل عقله.", "من هو خلف قضبان الحديد.", "الحاكم والمحكوم.", "لا يوجد سجون." ], correct:0 }
];

const STATE = {
    path:null, questionIndex:0, points:0, mistakes:0, stage:1,
    key:false, secret:false, puzzleSolved:false, worldStarted:false,
    punishCount:0, punishTarget:50, punishType:0, holdTimer:null,
    moveForward:false, moveBackward:false, moveLeft:false, moveRight:false
};

const intro = document.getElementById("intro");
const choiceScreen = document.getElementById("choiceScreen");
const philosophy = document.getElementById("philosophy");
const question = document.getElementById("question");
const answers = document.getElementById("answers");
const questionCounter = document.getElementById("questionCounter");
const progressBar = document.getElementById("progressBar");

const punishmentRoom = document.getElementById("punishmentRoom");
const punishmentSub = document.getElementById("punishmentSub");
const punishCounter = document.getElementById("punishCounter");
const punishBar = document.getElementById("punishBar");
const punishmentActionArea = document.getElementById("punishmentActionArea");

const game = document.getElementById("game");
const pointsElement = document.getElementById("points");
const mistakesElement = document.getElementById("mistakes");
const stageName = document.getElementById("stageName");
const robotText = document.getElementById("robotText");
const interactButton = document.getElementById("interact");
const puzzleModal = document.getElementById("puzzleModal");
const glitchOverlay = document.getElementById("glitchOverlay");
const bgPiano = document.getElementById("bgPiano");

let audioContext = null;
let masterGain = null;

function initAudio(){
    if(bgPiano) {
        bgPiano.volume = 0.5;
        bgPiano.play().catch(e => console.log("Audio waiting"));
    }
    if(audioContext) {
        if(audioContext.state === 'suspended') audioContext.resume();
        return;
    }
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if(AudioCtx) {
        audioContext = new AudioCtx();
        masterGain = audioContext.createGain();
        masterGain.gain.value = 0.15;
        masterGain.connect(audioContext.destination);
    }
}

document.addEventListener('touchstart', initAudio, { once: true });
document.addEventListener('click', initAudio, { once: true });

function triggerGlitchEffect() {
    glitchOverlay.style.opacity = '1';
    setTimeout(() => { glitchOverlay.style.opacity = '0'; }, 100);
}

function playTone(freq, type="sine", duration=0.5, vol=0.1){
    if(!audioContext) return;
    try {
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioContext.currentTime);
        gain.gain.setValueAtTime(vol, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + duration);
        osc.connect(gain); gain.connect(masterGain);
        osc.start(); osc.stop(audioContext.currentTime + duration);
    } catch(e){}
}

function choiceSound(){ playTone(120, "sawtooth", 0.3, 0.08); triggerGlitchEffect(); }
function correctSound(){ playTone(350, "sine", 0.4, 0.1); }
function wrongSound(){ playTone(50, "sawtooth", 1.0, 0.2); triggerGlitchEffect(); }

function choosePath(path){
    choiceSound();
    STATE.path = path;
    choiceScreen.classList.add("hide");
    philosophy.classList.add("active");
    createNewQuestion();
}

function createNewQuestion(){
    let total = QUESTIONS.length;
    let current = STATE.questionIndex;
    let selected = QUESTIONS[current];
    STATE.currentQuestion = selected;

    questionCounter.innerHTML = "QUESTION // " + (current + 1) + " OF " + total;
    progressBar.style.width = ((current / total) * 100) + "%";
    question.innerHTML = selected.text;
    answers.innerHTML = "";

    selected.answers.forEach(function(ans, index){
        const button = document.createElement("button");
        button.className = "answer";
        button.innerHTML = ans;
        button.onclick = function(){ answerQuestion(index); };
        answers.appendChild(button);
    });
}

function answerQuestion(index){
    if(index !== STATE.currentQuestion.correct){
        wrongSound();
        triggerPunishment();
        return;
    }
    
    correctSound();
    STATE.points += 200;
    STATE.questionIndex++;
    updateHUD();

    if(STATE.questionIndex >= QUESTIONS.length){
        progressBar.style.width = "100%";
        philosophy.classList.remove("active");
        intro.classList.add("hide");
        setTimeout(enterWorld, 1000);
    } else {
        createNewQuestion();
    }
}

/* ==========================================================
   نظام العقاب الديناميكي (عقاب جديد في كل مرة + عدم إعادة Progress)
========================================================== */
function triggerPunishment(){
    STATE.mistakes++;
    updateHUD();

    philosophy.classList.remove("active");
    intro.style.display = "none";
    if(puzzleModal) puzzleModal.classList.remove("active");
    
    // التبديل بين 3 أنواع مختلفة من العقاب
    STATE.punishType = (STATE.mistakes - 1) % 3;
    STATE.punishCount = 0;
    punishBar.style.width = "0%";
    punishmentActionArea.innerHTML = "";

    if(STATE.punishType === 0) {
        // عقاب 1: ضغط متكرر (عدد متغير)
        STATE.punishTarget = 40 + (STATE.mistakes * 10);
        punishmentSub.innerHTML = "عقاب الضغط السريع: قم بالضغط " + STATE.punishTarget + " مرة لتطهير خطئك المباشر.";
        punishCounter.innerHTML = "0 / " + STATE.punishTarget;
        
        const btn = document.createElement("button");
        btn.className = "punishBtn";
        btn.innerHTML = "PURGE SIN (CLICK)";
        btn.onclick = handlePunishClick;
        punishmentActionArea.appendChild(btn);

    } else if(STATE.punishType === 1) {
        // عقاب 2: الضغط المستمر (Hold Ritual)
        STATE.punishTarget = 100; // 100%
        punishmentSub.innerHTML = "عقاب التركيز: اضغط باستمرار دون رفع يدك لمدة 6 ثوانٍ كاملة.";
        punishCounter.innerHTML = "0%";
        
        const btn = document.createElement("button");
        btn.className = "punishBtn";
        btn.innerHTML = "HOLD TO PURGE";
        
        const startHold = () => {
            if(STATE.holdTimer) clearInterval(STATE.holdTimer);
            STATE.holdTimer = setInterval(() => {
                STATE.punishCount += 2;
                punishCounter.innerHTML = STATE.punishCount + "%";
                punishBar.style.width = STATE.punishCount + "%";
                playTone(200 + STATE.punishCount*2, "sine", 0.05, 0.02);
                
                if(STATE.punishCount >= 100){
                    clearInterval(STATE.holdTimer);
                    finishPunishment();
                }
            }, 100);
        };
        
        const stopHold = () => {
            if(STATE.holdTimer) clearInterval(STATE.holdTimer);
            if(STATE.punishCount < 100) {
                STATE.punishCount = 0;
                punishCounter.innerHTML = "0%";
                punishBar.style.width = "0%";
                wrongSound();
            }
        };

        btn.onmousedown = startHold;
        btn.onmouseup = stopHold;
        btn.ontouchstart = (e) => { e.preventDefault(); startHold(); };
        btn.ontouchend = (e) => { e.preventDefault(); stopHold(); };
        punishmentActionArea.appendChild(btn);

    } else if(STATE.punishType === 2) {
        // عقاب 3: كتابة نص الاعتراف
        const targetPhrase = "أنا أقر بجهلي";
        punishmentSub.innerHTML = "عقاب الاعتراف: اكتب العبارة التالية بدقة:<br><strong style='color:#fff;'>"+targetPhrase+"</strong>";
        punishCounter.innerHTML = "WAITING";
        
        const input = document.createElement("input");
        input.type = "text";
        input.className = "punishInput";
        input.placeholder = "اكتب هنا...";
        
        const btn = document.createElement("button");
        btn.className = "punishBtn";
        btn.style.display = "block";
        btn.style.margin = "auto";
        btn.innerHTML = "SUBMIT CONFESSION";
        btn.onclick = () => {
            if(input.value.trim() === targetPhrase) {
                finishPunishment();
            } else {
                wrongSound();
                input.value = "";
                input.placeholder = "خطأ! أعد الكتابة...";
            }
        };
        
        punishmentActionArea.appendChild(input);
        punishmentActionArea.appendChild(btn);
    }

    punishmentRoom.classList.add("active");
}

function handlePunishClick(){
    STATE.punishCount++;
    playTone(150 + STATE.punishCount*2, "square", 0.08, 0.05);
    triggerGlitchEffect();

    punishCounter.innerHTML = STATE.punishCount + " / " + STATE.punishTarget;
    punishBar.style.width = ((STATE.punishCount / STATE.punishTarget) * 100) + "%";

    if(STATE.punishCount >= STATE.punishTarget){
        finishPunishment();
    }
}

function finishPunishment(){
    correctSound();
    punishmentRoom.classList.remove("active");
    
    // العودة وإكمال العمل من نفس السؤال دون العودة للبداية
    if(!STATE.worldStarted){
        intro.style.display = "flex";
        intro.classList.remove("hide");
        philosophy.classList.add("active");
        createNewQuestion(); // يعرض السؤال الحالي نفسه الذي أخطأ فيه
    }
}

/* ==========================================================
   المحرك الثلاثي الأبعاد THREE.JS
========================================================== */
let scene, camera, renderer, monolith, monolithCore, gate, keyObject, secretObject, particlesSystem;
let clock = new THREE.Clock();

function initWorld(){
    if(scene) return;
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);
    scene.fog = new THREE.FogExp2(0x000000, 0.05);

    camera = new THREE.PerspectiveCamera(65, window.innerWidth/window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.6, 5);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const ambient = new THREE.AmbientLight(0x110003, 1.0);
    scene.add(ambient);

    const redLight = new THREE.PointLight(0xff003c, 3, 20);
    redLight.position.set(0, 3, 0);
    scene.add(redLight);

    createMonolith(); 
    createFloor(); 
    createGate(); 
    createKey(); 
    createSecret(); 
    createParticles();
    setupTouchControls();

    window.addEventListener("resize", resize);
    animate();
}

function createMonolith(){
    const group = new THREE.Group();
    const geo = new THREE.BoxGeometry(0.8, 5, 0.8);
    const mat = new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.1, metalness: 0.9 });
    const obelisk = new THREE.Mesh(geo, mat);
    
    const coreGeo = new THREE.SphereGeometry(0.2, 16, 16);
    const coreMat = new THREE.MeshBasicMaterial({ color: 0xff003c });
    monolithCore = new THREE.Mesh(coreGeo, coreMat);
    monolithCore.position.y = 0.5;

    group.add(obelisk, monolithCore);
    group.position.set(0, 2, -3);
    monolith = group;
    scene.add(monolith);
}

function createFloor(){
    const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(80, 80), 
        new THREE.MeshStandardMaterial({ color: 0x020202, roughness: 0.8, metalness: 0.2 })
    );
    ground.rotation.x = -Math.PI/2; 
    ground.position.y = 0; 
    scene.add(ground);
    
    const grid = new THREE.GridHelper(80, 40, 0xff003c, 0x110004);
    grid.position.y = 0.01;
    scene.add(grid);
}

function createGate(){
    gate = new THREE.Group();
    gate.position.set(0, 1.5, -10);
    const mat = new THREE.MeshStandardMaterial({ color: 0x080808, metalness: 0.9 });
    const left = new THREE.Mesh( new THREE.BoxGeometry(2, 5, 0.4), mat );
    const right = new THREE.Mesh( new THREE.BoxGeometry(2, 5, 0.4), mat );
    left.position.x = -2; right.position.x = 2;
    gate.add(left, right);
    gate.userData.left = left; gate.userData.right = right;
    scene.add(gate);
}

function createKey(){
    keyObject = new THREE.Group();
    const mesh = new THREE.Mesh(
        new THREE.OctahedronGeometry(0.3), 
        new THREE.MeshBasicMaterial({ color: 0xff003c, wireframe: true })
    );
    keyObject.add(mesh);
    keyObject.position.set(-3, 1, -1);
    scene.add(keyObject);
}

function createSecret(){
    secretObject = new THREE.Group();
    const mesh = new THREE.Mesh(
        new THREE.IcosahedronGeometry(0.3), 
        new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true })
    );
    secretObject.add(mesh);
    secretObject.position.set(3, 1, -2);
    scene.add(secretObject);
}

function createParticles(){
    const geometry = new THREE.BufferGeometry();
    const count = 600;
    const pos = new Float32Array(count * 3);
    for(let i=0; i<count*3; i+=3){
        pos[i] = (Math.random()-0.5)*40;
        pos[i+1] = Math.random()*10;
        pos[i+2] = (Math.random()-0.5)*40;
    }
    geometry.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const mat = new THREE.PointsMaterial({ color: 0xff003c, size: 0.05, transparent: true, opacity: 0.6 });
    particlesSystem = new THREE.Points(geometry, mat);
    scene.add(particlesSystem);
}

function setupTouchControls(){
    const bindBtn = (id, prop) => {
        const el = document.getElementById(id);
        if(!el) return;
        el.addEventListener("touchstart", (e)=>{ e.preventDefault(); STATE[prop] = true; });
        el.addEventListener("touchend", (e)=>{ e.preventDefault(); STATE[prop] = false; });
        el.addEventListener("mousedown", ()=>{ STATE[prop] = true; });
        el.addEventListener("mouseup", ()=>{ STATE[prop] = false; });
    };
    bindBtn("btnUp", "moveForward");
    bindBtn("btnDown", "moveBackward");
    bindBtn("btnLeft", "moveLeft");
    bindBtn("btnRight", "moveRight");

    window.addEventListener("keydown", (e)=>{
        if(e.key === "w" || e.key === "ArrowUp") STATE.moveForward = true;
        if(e.key === "s" || e.key === "ArrowDown") STATE.moveBackward = true;
        if(e.key === "a" || e.key === "ArrowLeft") STATE.moveLeft = true;
        if(e.key === "d" || e.key === "ArrowRight") STATE.moveRight = true;
    });
    window.addEventListener("keyup", (e)=>{
        if(e.key === "w" || e.key === "ArrowUp") STATE.moveForward = false;
        if(e.key === "s" || e.key === "ArrowDown") STATE.moveBackward = false;
        if(e.key === "a" || e.key === "ArrowLeft") STATE.moveLeft = false;
        if(e.key === "d" || e.key === "ArrowRight") STATE.moveRight = false;
    });

    let isDragging = false, prevX = 0, prevY = 0;
    window.addEventListener("pointerdown", (e)=>{
        if(e.target.closest("#hud") || e.target.closest("#intro")) return;
        isDragging = true; prevX = e.clientX; prevY = e.clientY;
    });
    window.addEventListener("pointermove", (e)=>{
        if(!isDragging) return;
        let deltaX = e.clientX - prevX;
        camera.rotation.y -= deltaX * 0.003;
        prevX = e.clientX; prevY = e.clientY;
    });
    window.addEventListener("pointerup", ()=> isDragging = false);
}

function enterWorld(){
    STATE.worldStarted = true;
    game.classList.add("active");
    initWorld();
    robotText.innerHTML = "اجتزت التقييم الفلسفي..." + "<br>" + "استكشف الفراغ واستخرج المفتاح لتفتيح البوابة.";
}

function updateHUD(){
    pointsElement.innerHTML = STATE.points;
    mistakesElement.innerHTML = STATE.mistakes;
    stageName.innerHTML = "SECTOR 0" + STATE.stage;
}

function interact(){
    if(!STATE.worldStarted) return;
    const dKey = camera.position.distanceTo(keyObject.position);
    const dSecret = camera.position.distanceTo(secretObject.position);
    const dGate = camera.position.distanceTo(gate.position);

    if(dKey < 3 && keyObject.visible){ takeKey(); return; }
    if(dSecret < 3 && secretObject.visible){ discoverSecret(); return; }
    if(dGate < 4){ gateChallenge(); return; }
}

function takeKey(){
    STATE.key = true; STATE.points += 500; keyObject.visible = false;
    choiceSound();
    robotText.innerHTML = "تم العثور على مفتاح البوابة." + "<br>" + "توجه إلى الأبواب الضخمة الآن.";
    updateHUD();
}

function discoverSecret(){
    STATE.secret = true; STATE.points += 1000; secretObject.visible = false;
    correctSound();
    robotText.innerHTML = "اكتشفت الشفرة السرية للعدم.";
    updateHUD();
}

function gateChallenge(){
    if(!STATE.key){
        wrongSound();
        robotText.innerHTML = "البوابة مغلقة!" + "<br>" + "ابحث عن الشفرة الكريستالية الحمراء في الفضاء.";
        return;
    }
    choiceSound();
    openPuzzle("اختبار البوابة النهائي", "ما هو الشيء الذي يحوي جميع أسرار الماضي ولكنه يجهل مستقبله؟", ["الذاكرة", "المقبرة", "الكتاب", "العقل"], 0);
}

function openPuzzle(title, description, choices, correct){
    puzzleModal.classList.add("active");
    document.getElementById("puzzleTitle").innerHTML = title;
    document.getElementById("puzzleDescription").innerHTML = description;
    const container = document.getElementById("puzzleAnswers");
    container.innerHTML = "";
    document.getElementById("puzzleResult").innerHTML = "";
    
    choices.forEach(function(choice,index){
        const button = document.createElement("button");
        button.className = "modalAnswer";
        button.innerHTML = choice;
        button.onclick = function(){
            if(index === correct){ puzzleSuccess(); }else{ triggerPunishment(); }
        };
        container.appendChild(button);
    });
}

function puzzleSuccess(){
    correctSound();
    STATE.puzzleSolved = true; STATE.points += 2000;
    document.getElementById("puzzleResult").innerHTML = " تم فتح البوابة.";
    setTimeout(function(){ puzzleModal.classList.remove("active"); openGate(); }, 1000);
}

function openGate(){
    let progress = 0;
    const timer = setInterval(function(){
        progress += 0.03;
        gate.userData.left.position.x = -2 - progress*2;
        gate.userData.right.position.x = 2 + progress*2;
        if(progress>=1){
            clearInterval(timer);
            STATE.stage = 2; updateHUD();
            robotText.innerHTML = "عبور مكتمل. مرحباً بك في الأعماق.";
        }
    }, 30);
}

setInterval(function(){
    if(!STATE.worldStarted) return;
    const candidates = [keyObject, secretObject, gate];
    let near = false;
    candidates.forEach(function(object){
        if(!object || !object.visible) return;
        if(camera.position.distanceTo(object.position) < 3.5) near = true;
    });
    if(near) interactButton.classList.add("show"); else interactButton.classList.remove("show");
}, 150);

function resize(){
    if(!camera || !renderer) return;
    camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

function animate(){
    requestAnimationFrame(animate);
    if(!scene) return;

    const delta = clock.getDelta();
    const speed = 4.0 * delta;

    if(STATE.moveForward) camera.translateZ(-speed);
    if(STATE.moveBackward) camera.translateZ(speed);
    if(STATE.moveLeft) camera.translateX(-speed);
    if(STATE.moveRight) camera.translateX(speed);
    camera.position.y = 1.6;

    if(monolith){
        monolith.rotation.y += delta * 0.5;
        const scale = 1 + Math.sin(clock.getElapsedTime() * 4) * 0.1;
        monolithCore.scale.set(scale, scale, scale);
    }

    renderer.render(scene, camera);
}
</script>
